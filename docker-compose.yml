# Full stack: Postgres + Redis + API + background worker + web UI.
#   cp .env.example .env   (then fill it in)
#   docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vendorguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: vendorguard
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vendorguard"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine

  backend: &backend
    build: ./backend
    environment: &backend-env
      ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      DATABASE_URL: postgresql+psycopg://vendorguard:${POSTGRES_PASSWORD}@db:5432/vendorguard
      REDIS_URL: redis://redis:6379/0
      QUEUE_MODE: rq
      UPLOAD_DIR: /data/uploads
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_DEMO: ${SEED_DEMO:-false}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_SECRET: ${ALERT_WEBHOOK_SECRET:-}
      ALERT_FORMAT: ${ALERT_FORMAT:-slack}
      APP_BASE_URL: ${APP_BASE_URL:-}
    volumes: [uploads:/data/uploads]
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    <<: *backend
    ports: []
    command: ["rq", "worker", "--url", "redis://redis:6379/0", "default"]

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-false}
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  pgdata:
  uploads:
